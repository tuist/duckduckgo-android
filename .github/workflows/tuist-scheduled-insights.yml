name: Tuist scheduled insights

# Runs a build and the JVM test suite on `develop` twice a day so
# https://tuist.dev/tuist/duckduckgo-android keeps getting fresh build and
# test insights even when there is no PR/push activity on this fork.
#
# The Tuist Gradle plugin (see settings.gradle) uploads build events and
# `Test` task results automatically, so no extra configuration is needed
# here beyond running the relevant Gradle tasks and authenticating.
#
# Authentication uses GitHub Actions OIDC (no long-lived secret): the
# `tuist` CLI, invoked with `auth login`, detects the CI environment,
# fetches a short-lived OIDC token via the id-token request env vars, and
# exchanges it for a Tuist access token that it writes to
# `~/.config/tuist/credentials/tuist.dev.json`. The Gradle plugin then
# reads that file automatically at build time.

on:
  schedule:
    # 07:00 and 19:00 UTC. Offset from the 02:00 UTC `build-benchmark-nightly`
    # run and from `sync-upstream` (every 6 hours at :17).
    - cron: "0 7,19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# `id-token: write` is what makes ACTIONS_ID_TOKEN_REQUEST_URL and
# ACTIONS_ID_TOKEN_REQUEST_TOKEN available in the job env, which the Tuist
# CLI needs for the OIDC exchange. Declaring `permissions:` overrides the
# repo default, so `contents: read` has to be listed explicitly for
# `actions/checkout` to work.
permissions:
  contents: read
  id-token: write

jobs:
  build_and_test:
    name: Scheduled build and tests
    # DuckDuckGo's `android-large-runner` label is a self-hosted pool that
    # doesn't exist in the tuist org — jobs targeting it queue for 24h and
    # then get cancelled (see the fork's stuck `build-benchmark-nightly`
    # runs). Use a GitHub-hosted Ubuntu runner instead. It's slower for a
    # full Android build, but it actually runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive

      - name: Set up JDK version
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Tuist CLI
        uses: jdx/mise-action@v2
        with:
          tool_versions: |
            tuist latest

      - name: Authenticate with Tuist via GitHub OIDC
        # The CLI detects CI + id-token request env vars, exchanges the
        # GitHub OIDC token for a short-lived Tuist access token, and
        # writes it to the credential store that the Gradle plugin reads.
        # Requires the tuist.dev project `tuist/duckduckgo-android` to be
        # connected to the GitHub repository (see PR description).
        run: tuist auth login --url https://tuist.dev

      - name: Assemble Play debug
        run: ./gradlew assemblePlayDebug --stacktrace

      - name: JVM tests
        # Full suite (no predictive test selection) so Tuist gets a complete
        # picture of test duration and flakiness on a known-good baseline.
        run: ./gradlew jvm_tests --stacktrace

      - name: Bundle the JVM checks report
        if: always()
        run: find . -type d -name 'reports' | zip -@ -r scheduled-insights-report.zip || true

      - name: Upload the JVM checks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-insights-report
          path: scheduled-insights-report.zip
          if-no-files-found: ignore
